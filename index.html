<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS CLF-C02 Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>AWS CLF-C02 Simulator</h1>
    <nav>
      <button data-mode="all">Todas</button>
      <button data-mode="new">Questões novas</button>
      <button data-mode="errors">Banco de Erros</button>
      <button data-mode="exam">Simulado</button>
      <button data-view="statistics">Estatísticas</button>
      <button data-view="bank">Banco de Questões</button>
      <button data-view="add">Adicionar questão</button>
      <button id="settingsBtn" type="button">Configurações</button>
    </nav>
  </header>

  <div id="warn" class="banner warn" hidden></div>
  <div id="catalogNotice" class="banner warn" hidden></div>
  <div id="stats" class="stats"></div>
  <main id="main"></main>

  <footer>
    <span id="saveStatus" role="status">Carregando progresso...</span>
    <button id="fullBackupBtn" class="link">Criar backup completo</button>
    <button id="fullRestoreBtn" class="link">Validar e restaurar backup</button>
    <button id="exportBtn" class="link">Exportar progresso</button>
    <button id="importBtn" class="link">Importar progresso</button>
    <button id="resetBtn" class="link danger">Apagar progresso</button>
    <input id="importFile" type="file" accept="application/json" hidden>
    <input id="fullBackupFile" type="file" accept="application/json,.json" hidden>
    <input id="bankImportFile" type="file" accept="application/json" hidden>
  </footer>

  <div id="toast" role="status" hidden></div>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
